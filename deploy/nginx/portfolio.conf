# Portfolio reverse proxy. Install as /etc/nginx/sites-available/portfolio.conf, symlinked into
# sites-enabled. Names are prefixed portfolio_ / portfolio- so they cannot clash with other sites;
# localhost port 3100 is the portfolio's. TLS and HSTS are set here, the other headers by the
# container's own nginx.conf.
#
# portfolio., the bare domain and www. all serve the site; its pages name portfolio. as the canonical URL.
#
# The certificate must exist before Nginx will load this file (the server's catch-all answers the
# first challenge; afterwards the port-80 block below does):
#   sudo certbot certonly --webroot -w /var/www/html --cert-name portfolio \
#     --deploy-hook "systemctl reload nginx" \
#     -d portfolio.aswin-ambalathara.space -d aswin-ambalathara.space -d www.aswin-ambalathara.space

upstream portfolio_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

# Plain HTTP serves certificate renewal challenges and redirects everything else
server {
    listen 80;
    listen [::]:80;
    server_name portfolio.aswin-ambalathara.space aswin-ambalathara.space www.aswin-ambalathara.space;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portfolio.aswin-ambalathara.space aswin-ambalathara.space www.aswin-ambalathara.space;

    include snippets/portfolio-tls.conf;

    location / {
        proxy_pass http://portfolio_web;
    }
}
