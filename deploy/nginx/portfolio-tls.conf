# TLS and proxy settings for the portfolio. Install as /etc/nginx/snippets/portfolio-tls.conf.

ssl_certificate /etc/letsencrypt/live/portfolio/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/portfolio/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:portfolio_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# A static site takes no uploads
client_max_body_size 1m;

# HTTPS only from now on. No includeSubDomains: on the bare domain it would also force HTTPS on
# every other hostname under it
add_header Strict-Transport-Security "max-age=31536000" always;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
